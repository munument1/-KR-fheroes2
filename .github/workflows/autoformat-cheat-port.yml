name: Auto-format cheat port

on:
  push:
    branches:
      - feature/legacy-cheat-codes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/legacy-cheat-codes
          fetch-depth: 0

      - name: Select clang-format 17
        run: |
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-17 100

      - name: Format cheat port
        run: |
          clang-format -i \
            src/fheroes2/game/game_interface.h \
            src/fheroes2/game/game_startgame.cpp \
            src/fheroes2/gui/interface_events.cpp
          git diff --check

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/fheroes2/game/game_interface.h \
            src/fheroes2/game/game_startgame.cpp \
            src/fheroes2/gui/interface_events.cpp
          git commit -m "style: format cheat code port"
          git push origin HEAD:feature/legacy-cheat-codes
