name: Apply full legacy cheats

on:
  push:
    branches:
      - feature/legacy-cheat-codes-work

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/legacy-cheat-codes-work
          fetch-depth: 0

      - name: Apply source patch
        run: python3 script/tools/apply_full_legacy_cheats.py

      - name: Format and validate
        run: |
          clang-format-17 -i \
            src/fheroes2/game/game_interface.h \
            src/fheroes2/game/game_startgame.cpp \
            src/fheroes2/gui/interface_events.cpp \
            src/fheroes2/game/game_over.h \
            src/fheroes2/game/game_over.cpp \
            src/fheroes2/heroes/heroes.h \
            src/fheroes2/heroes/heroes.cpp
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fheroes2
          git commit -m "feat: add complete Heroes II numeric cheats"
          git push origin HEAD:feature/legacy-cheat-codes-work
