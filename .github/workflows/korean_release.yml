name: Publish Korean Release

on:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Wait for Korean Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_id=""
          for attempt in $(seq 1 100); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow korean_utf8_prototype.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId,status,conclusion)"

            run_id="$(printf '%s' "$run_json" | jq -r '.[0].databaseId // empty')"
            status="$(printf '%s' "$run_json" | jq -r '.[0].status // empty')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.[0].conclusion // empty')"

            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Korean Windows build run $run_id finished with conclusion: $conclusion"
                exit 1
              fi
              echo "WINDOWS_RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for the Korean Windows build."
          exit 1

      - name: Wait for Korean Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          push_run_id=""
          for attempt in $(seq 1 100); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow push.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId)"

            push_run_id="$(printf '%s' "$run_json" | jq -r '.[0].databaseId // empty')"
            if [ -n "$push_run_id" ]; then
              jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$push_run_id/jobs?per_page=100")"
              status="$(printf '%s' "$jobs_json" | jq -r '.jobs[] | select(.name == "Android / Android") | .status' | head -n 1)"
              conclusion="$(printf '%s' "$jobs_json" | jq -r '.jobs[] | select(.name == "Android / Android") | .conclusion // empty' | head -n 1)"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "Android job in push run $push_run_id finished with conclusion: $conclusion"
                  exit 1
                fi
                echo "ANDROID_PUSH_RUN_ID=$push_run_id" >> "$GITHUB_ENV"
                exit 0
              fi
            fi

            sleep 15
          done

          echo "Timed out waiting for the Korean Android build."
          exit 1

      - name: Download Korean Windows build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-files/windows
          gh run download "$WINDOWS_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name fheroes2-korean-windows-x64 \
            --dir release-files/windows

      - name: Download Korean Android release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-files/android

          for attempt in $(seq 1 20); do
            body="$(gh release view fheroes2-korean-android --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq "$GITHUB_SHA"; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "Android rolling release was not updated to source commit $GITHUB_SHA."
              exit 1
            fi
            sleep 10
          done

          gh release download fheroes2-korean-android \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'fheroes2-korean.apk' \
            --pattern 'fheroes2_korean_android.zip' \
            --pattern 'fheroes2-korean.aab' \
            --pattern 'fheroes2_korean_android_aab.zip' \
            --dir release-files/android

      - name: Package Windows release ZIP
        run: |
          set -euo pipefail
          archive="fheroes2-korean-windows-x64-20260903-campaign-subtitles.zip"
          (
            cd release-files/windows
            zip -r "../../$archive" .
          )
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify release files and create checksums
        run: |
          set -euo pipefail

          test -f "$RELEASE_ARCHIVE"
          test -f release-files/android/fheroes2-korean.apk
          test -f release-files/android/fheroes2_korean_android.zip
          test -f release-files/android/fheroes2-korean.aab
          test -f release-files/android/fheroes2_korean_android_aab.zip

          sha256sum \
            "$RELEASE_ARCHIVE" \
            release-files/android/fheroes2-korean.apk \
            release-files/android/fheroes2_korean_android.zip \
            release-files/android/fheroes2-korean.aab \
            release-files/android/fheroes2_korean_android_aab.zip \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="korean-20260903-campaign-subtitles-r${GITHUB_RUN_NUMBER}"
          title="fheroes2 한국어 빌드 - 캠페인 영상 자막 추가 (2026-09-03)"

          cat > release-notes.md <<'EOF'
          ## fheroes2 비공식 한국어 빌드

          Heroes of Might and Magic II 캠페인 영상 한국어 자막을 정식 한국어 빌드에 통합한 릴리즈입니다.

          ### 주요 추가 및 수정
          - Succession Wars 오프닝 `INTRO.SMK` 한국어 자막
          - 롤랜드/아치발드 본편 캠페인 음성 영상 24개 한국어 자막
          - Price of Loyalty 확장팩 캠페인 음성 영상 25개 한국어 자막
            - The Price of Loyalty
            - Descendants
            - Wizard's Isle
            - Voyage Home
          - 한국어 large font 기반 하단 중앙 자막 표시
          - 원본 SMK 영상 파일은 수정하거나 배포하지 않고 런타임 오버레이 방식으로 표시
          - 기존 한국어 맵/UI 문자열 보완 유지
          - Heroes II 레거시 숫자 치트 코드 통합 유지

          ### 포함 파일
          - Windows x64 한국어 빌드 ZIP
          - Android APK
          - Android APK 배포 ZIP
          - Android AAB
          - Android AAB 배포 ZIP
          - SHA-256 체크섬

          원본 Heroes of Might and Magic II 게임 데이터가 필요합니다.
          EOF

          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> release-notes.md

          gh release create "$tag" \
            "$RELEASE_ARCHIVE" \
            release-files/android/fheroes2-korean.apk \
            release-files/android/fheroes2_korean_android.zip \
            release-files/android/fheroes2-korean.aab \
            release-files/android/fheroes2_korean_android_aab.zip \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file release-notes.md

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
