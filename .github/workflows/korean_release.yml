name: Publish Korean Release

on:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Wait for Korean Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_id=""
          for attempt in $(seq 1 80); do
            run_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow korean_utf8_prototype.yml \
              --commit "$GITHUB_SHA" \
              --limit 1 \
              --json databaseId,status,conclusion)"

            run_id="$(printf '%s' "$run_json" | jq -r '.[0].databaseId // empty')"
            status="$(printf '%s' "$run_json" | jq -r '.[0].status // empty')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.[0].conclusion // empty')"

            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Korean build run $run_id finished with conclusion: $conclusion"
                exit 1
              fi
              echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
              exit 0
            fi

            sleep 15
          done

          echo "Timed out waiting for the Korean Windows build."
          exit 1

      - name: Download Korean build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name fheroes2-korean-windows-x64 \
            --dir release-files

      - name: Package release ZIP
        run: |
          set -euo pipefail
          archive="fheroes2-korean-windows-x64-20260820-numeric-spacing-fix.zip"
          (
            cd release-files
            zip -r "../$archive" .
          )
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="korean-20260820-numeric-spacing-r${GITHUB_RUN_NUMBER}"
          title="fheroes2 한국어 빌드 - 숫자 간격 수정 (2026-08-20)"

          cat > release-notes.md <<'EOF'
          ## fheroes2 비공식 한국어 빌드

          숫자 폰트를 한국어와 같은 Galmuri 크기로 통일한 뒤 연속된 숫자가 서로 겹치던 문제를 수정한 버전입니다.

          ### 주요 수정
          - 숫자 `0-9`는 계속 한국어와 동일한 Galmuri 12px/24px 글리프를 사용
          - 단일 바이트 숫자 스프라이트에 정상 advance를 부여하여 연속 숫자 겹침 수정
          - 한글의 기존 3바이트 advance 처리 방식은 그대로 유지
          - 숫자와 한글의 크기, 베이스라인, 색상, 1px 그림자 처리 통일 유지
          - 기존 표준 맵 이름/맵 설명 한국어 보완 및 런타임 오버라이드 유지

          ### 포함 파일
          - Windows x64 `fheroes2.exe`
          - 실행에 필요한 DLL
          - 한국어 런타임 카탈로그 `files/lang/ko.mo`

          원본 Heroes of Might and Magic II의 게임 데이터가 필요합니다.
          EOF

          gh release create "$tag" "$RELEASE_ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file release-notes.md

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
