name: Export Korean Translation CSV

on:
  push:
    branches:
      - korean-utf8-prototype
    paths:
      - files/lang/tr.po
      - files/lang/ru.po
      - .github/workflows/export_translation_csv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-csv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Export English, Russian and Turkish references to Korean translation CSV
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import csv
          from pathlib import Path

          tr_src = Path('files/lang/tr.po')
          ru_src = Path('files/lang/ru.po')
          out = Path('fheroes2_KO_translation_working_EN_RU_TR.csv')
          summary = Path('fheroes2_KO_translation_working_EN_RU_TR_summary.txt')

          def qvalue(text):
              return ast.literal_eval(text.strip())

          def blank_entry():
              return {
                  'msgctxt': '',
                  'msgid': '',
                  'msgid_plural': '',
                  'msgstr': '',
                  'msgstr_plural': {},
                  'flags': [],
                  'refs': [],
                  'extracted_comments': [],
                  'translator_comments': [],
              }

          def parse_po(path):
              entries = []
              state = {'entry': blank_entry(), 'active': None}

              def flush():
                  entry = state['entry']
                  if entry['msgid'] or entry['msgid_plural']:
                      entries.append(entry)
                  state['entry'] = blank_entry()
                  state['active'] = None

              def append_active(value):
                  kind, index = state['active']
                  entry = state['entry']
                  if kind == 'msgstr_plural':
                      entry['msgstr_plural'][index] = entry['msgstr_plural'].get(index, '') + value
                  else:
                      entry[kind] += value

              for raw in path.read_text(encoding='utf-8-sig').splitlines():
                  line = raw.rstrip('\n')
                  entry = state['entry']

                  if not line.strip():
                      flush()
                      continue

                  if line.startswith('#:'):
                      entry['refs'].extend(line[2:].strip().split())
                      state['active'] = None
                      continue
                  if line.startswith('#,'):
                      entry['flags'].extend(x.strip() for x in line[2:].split(',') if x.strip())
                      state['active'] = None
                      continue
                  if line.startswith('#.'):
                      entry['extracted_comments'].append(line[2:].strip())
                      state['active'] = None
                      continue
                  if line.startswith('#'):
                      entry['translator_comments'].append(line[1:].strip())
                      state['active'] = None
                      continue

                  if line.startswith('msgctxt '):
                      entry['msgctxt'] = qvalue(line[len('msgctxt '):])
                      state['active'] = ('msgctxt', None)
                      continue
                  if line.startswith('msgid_plural '):
                      entry['msgid_plural'] = qvalue(line[len('msgid_plural '):])
                      state['active'] = ('msgid_plural', None)
                      continue
                  if line.startswith('msgid '):
                      entry['msgid'] = qvalue(line[len('msgid '):])
                      state['active'] = ('msgid', None)
                      continue
                  if line.startswith('msgstr['):
                      close = line.index(']')
                      index = int(line[len('msgstr['):close])
                      entry['msgstr_plural'][index] = qvalue(line[close + 1:].strip())
                      state['active'] = ('msgstr_plural', index)
                      continue
                  if line.startswith('msgstr '):
                      entry['msgstr'] = qvalue(line[len('msgstr '):])
                      state['active'] = ('msgstr', None)
                      continue
                  if line.startswith('"') and state['active'] is not None:
                      append_active(qvalue(line))
                      continue

                  raise RuntimeError(f'Unsupported PO line in {path}: {line!r}')

              flush()
              return entries

          tr_entries = parse_po(tr_src)
          ru_entries = parse_po(ru_src)

          def key(entry):
              return (entry['msgctxt'], entry['msgid'], entry['msgid_plural'])

          ru_by_key = {key(entry): entry for entry in ru_entries}

          def split_context(text):
              if '|' not in text:
                  return '', text
              prefix, visible = text.split('|', 1)
              if prefix and '\n' not in prefix and len(prefix) <= 64:
                  return prefix, visible
              return '', text

          fields = [
              'row_id',
              'context',
              'msgctxt',
              'msgid_raw',
              'english',
              'english_plural',
              'russian_ref',
              'russian_plural_0',
              'russian_plural_1',
              'russian_plural_2',
              'turkish_ref',
              'turkish_plural_0',
              'turkish_plural_1',
              'korean',
              'korean_plural_0',
              'flags',
              'source_refs',
              'comments',
          ]

          fuzzy_count = 0
          plural_count = 0
          russian_untranslated = 0
          russian_missing_key = 0
          turkish_untranslated = 0

          with out.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()

              for i, tr in enumerate(tr_entries, 1):
                  ru = ru_by_key.get(key(tr))
                  context_hint, english = split_context(tr['msgid'])
                  _, english_plural = split_context(tr['msgid_plural']) if tr['msgid_plural'] else ('', '')
                  flags = ','.join(tr['flags'])

                  if 'fuzzy' in tr['flags']:
                      fuzzy_count += 1
                  if tr['msgid_plural']:
                      plural_count += 1
                  if not tr['msgstr'] and not any(tr['msgstr_plural'].values()):
                      turkish_untranslated += 1

                  if ru is None:
                      russian_missing_key += 1
                      ru = blank_entry()
                  elif not ru['msgstr'] and not any(ru['msgstr_plural'].values()):
                      russian_untranslated += 1

                  comments = ' | '.join(x for x in (tr['extracted_comments'] + tr['translator_comments']) if x)
                  writer.writerow({
                      'row_id': i,
                      'context': context_hint,
                      'msgctxt': tr['msgctxt'],
                      'msgid_raw': tr['msgid'],
                      'english': english,
                      'english_plural': english_plural,
                      'russian_ref': ru['msgstr'],
                      'russian_plural_0': ru['msgstr_plural'].get(0, ''),
                      'russian_plural_1': ru['msgstr_plural'].get(1, ''),
                      'russian_plural_2': ru['msgstr_plural'].get(2, ''),
                      'turkish_ref': tr['msgstr'],
                      'turkish_plural_0': tr['msgstr_plural'].get(0, ''),
                      'turkish_plural_1': tr['msgstr_plural'].get(1, ''),
                      'korean': '',
                      'korean_plural_0': '',
                      'flags': flags,
                      'source_refs': ' '.join(tr['refs']),
                      'comments': comments,
                  })

          summary.write_text(
              '\n'.join([
                  f'base_source={tr_src}',
                  f'russian_source={ru_src}',
                  f'entries={len(tr_entries)}',
                  f'plural_entries={plural_count}',
                  f'fuzzy_entries={fuzzy_count}',
                  f'russian_untranslated_entries={russian_untranslated}',
                  f'russian_missing_key_entries={russian_missing_key}',
                  f'turkish_untranslated_entries={turkish_untranslated}',
                  'encoding=UTF-8 with BOM',
                  'reference_priority=English meaning > Russian primary reference > Turkish secondary reference',
                  'korean_columns=blank',
              ]) + '\n',
              encoding='utf-8'
          )
          print(summary.read_text(encoding='utf-8'))
          PY

      - name: Upload translation CSV artifact
        uses: actions/upload-artifact@v7
        with:
          name: fheroes2-KO-translation-EN-RU-TR
          path: |
            fheroes2_KO_translation_working_EN_RU_TR.csv
            fheroes2_KO_translation_working_EN_RU_TR_summary.txt
          if-no-files-found: error
