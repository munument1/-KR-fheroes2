name: Korean UTF-8 Prototype

on:
  push:
    branches:
      - korean-utf8-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 prototype build
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install fheroes2 dependencies
        run: |
          script/windows/install_packages.bat

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate Korean bitmap font
        run: |
          python -m pip install --disable-pip-version-check pillow
          mkdir -p build
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.ttf',
              'build/Galmuri11.ttf'
          )
          PY
          python script/generate_korean_font.py build/Galmuri11.ttf src/fheroes2/gui/korean_font_generated.h

      - name: Install gettext
        shell: powershell
        run: |
          choco install gettext -y --no-progress

      - name: Validate Korean PO
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('files/lang/ko.po').read_text(encoding='utf-8')
          old = r'''msgid "sphinx|'\n\nYour answer?"''' + '\n' + r'''msgstr "\n\n당신의 답은?"'''
          new = r'''msgid "sphinx|'\n\nYour answer?"''' + '\n' + r'''msgstr "'\n\n당신의 답은?"'''
          if old not in text:
              raise SystemExit('Expected Sphinx translation entry was not found.')
          Path('build/ko-build.po').write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          "/c/Program Files/gettext-iconv/bin/msgfmt.exe" --check --check-format build/ko-build.po -o build/ko-utf8.mo

      - name: Register Korean locale
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engine/translations.cpp')
          text = path.read_text(encoding='utf-8')

          old = '''        LOCALE_IT,\n        LOCALE_LA,'''
          new = '''        LOCALE_IT,\n        LOCALE_KO,\n        LOCALE_LA,'''
          if old not in text:
              raise SystemExit('Locale enum insertion point not found.')
          text = text.replace(old, new, 1)

          old = '''                                                                                  // Latin\n                                                                                  { "la", LocaleType::LOCALE_LA },'''
          new = '''                                                                                  // Korean\n                                                                                  { "ko", LocaleType::LOCALE_KO },\n                                                                                  { "korean", LocaleType::LOCALE_KO },\n                                                                                  // Latin\n                                                                                  { "la", LocaleType::LOCALE_LA },'''
          if old not in text:
              raise SystemExit('Locale map insertion point not found.')
          text = text.replace(old, new, 1)

          old = '''        case LocaleType::LOCALE_EL:\n        case LocaleType::LOCALE_FR:'''
          new = '''        case LocaleType::LOCALE_KO:\n            return current->ngettext( str, 0 );\n        case LocaleType::LOCALE_EL:\n        case LocaleType::LOCALE_FR:'''
          if old not in text:
              raise SystemExit('Plural rule insertion point not found.')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - uses: microsoft/setup-msbuild@v3

      - name: Build fheroes2
        run: |
          MSBuild.exe fheroes2-vs2019.vcxproj /property:Platform=x64 /property:Configuration=Release-SDL2

      - name: Build Korean runtime catalog
        run: |
          mkdir -p build/x64/Release-SDL2/files/lang
          python script/compile_korean_mo.py build/ko-utf8.mo build/x64/Release-SDL2/files/lang/ko.mo

      - name: Upload prototype executable
        uses: actions/upload-artifact@v7
        with:
          name: fheroes2-korean-utf8-prototype-windows-x64
          path: |
            build/x64/Release-SDL2/fheroes2.exe
            build/x64/Release-SDL2/*.dll
            build/x64/Release-SDL2/files/lang/ko.mo
          if-no-files-found: error
