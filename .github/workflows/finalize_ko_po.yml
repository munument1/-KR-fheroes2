name: Finalize Korean PO

on:
  push:
    branches:
      - korean-utf8-prototype
    paths:
      - .github/workflows/finalize_ko_po.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Rebuild and validate full ko.po
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebuild full Korean catalog
        shell: bash
        run: |
          : > /tmp/ko.po.bz2
          for part in .github/ko_payload3/part*.b64; do
            base64 --decode "$part" >> /tmp/ko.po.bz2
          done
          bzip2 --test /tmp/ko.po.bz2
          bzip2 --decompress --stdout /tmp/ko.po.bz2 > files/lang/ko.po

          python3 - <<'PY'
          from pathlib import Path

          path = Path('files/lang/ko.po')
          text = path.read_text(encoding='utf-8')

          # Normalize only the PO header if an earlier generator double-escaped newlines.
          blocks = text.split('\n\n', 1)
          if len(blocks) == 2:
              header, body = blocks
              header = header.replace('\\\\n"', '\\n"')
              text = header + '\n\n' + body
              path.write_text(text, encoding='utf-8', newline='')

          lines = text.splitlines()
          entries = sum(1 for line in lines if line.startswith('msgid ')) - 1
          plurals = sum(1 for line in lines if line.startswith('msgid_plural '))
          fuzzy = sum(1 for line in lines if line.startswith('#,') and 'fuzzy' in line)

          assert entries == 3240, entries
          assert plurals == 30, plurals
          assert '"Language: ko\\n"' in text
          assert '"Plural-Forms: nplurals=1; plural=0;\\n"' in text
          assert 'msgid "Move the %{name} "' in text
          assert 'msgid "Map: "' in text
          assert 'msgid "Warrior"' in text and 'msgstr "전사"' in text
          assert fuzzy == 0, fuzzy

          print(f'entries={entries}')
          print(f'plural_entries={plurals}')
          print(f'fuzzy_entries={fuzzy}')
          PY

      - name: Validate gettext catalog
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          msgfmt --check --check-format files/lang/ko.po -o /tmp/ko.mo
          test -s /tmp/ko.mo
          msgunfmt /tmp/ko.mo > /tmp/ko.roundtrip.po
          test -s /tmp/ko.roundtrip.po

      - name: Commit final catalog and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf .github/ko_parts .github/ko_parts2 .github/ko_payload2 .github/ko_payload3
          rm -f .github/workflows/finalize_ko_po.yml

          git add -A
          git diff --cached --check
          git commit -m "Finalize full Korean translation catalog"
          git push origin HEAD:korean-utf8-prototype
