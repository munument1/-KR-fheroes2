name: Finalize Korean PO

on:
  push:
    branches:
      - korean-utf8-prototype
    paths:
      - .github/workflows/finalize_ko_po.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gettext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext

      - name: Build ko.po from the existing Turkish catalog structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, bz2, json, re

          payload = ''''''
          translations = json.loads(bz2.decompress(base64.b64decode(payload)).decode('utf-8'))
          assert len(translations) == 3240, len(translations)

          source = Path('files/lang/tr.po').read_text(encoding='utf-8')
          blocks = re.split(r'\n{2,}', source.strip())
          header_block = blocks[0]
          entries = blocks[1:]
          assert len(entries) == 3240, len(entries)

          def q(s):
              return '"' + s.replace('\\', '\\\\').replace('"', '\\"').replace('\t', '\\t').replace('\r', '\\r').replace('\n', '\\n') + '"'

          header = '''# Korean translation for fheroes2
# Copyright (C) 2026 fheroes2 team <fhomm2@gmail.com>
# This file is distributed under the same license as the fheroes2 package.
#
msgid ""
msgstr ""
"Project-Id-Version: fheroes2\\n"
"Report-Msgid-Bugs-To: fhomm2@gmail.com\\n"
"PO-Revision-Date: 2026-08-14 16:38+0900\\n"
"Language-Team: Korean\\n"
"Language: ko\\n"
"MIME-Version: 1.0\\n"
"Content-Type: text/plain; charset=UTF-8\\n"
"Content-Transfer-Encoding: 8bit\\n"
"Plural-Forms: nplurals=1; plural=0;\\n"'''

          out = [header]
          for block, ko in zip(entries, translations):
              lines = block.splitlines()
              start = next(i for i, line in enumerate(lines) if line.startswith('msgstr'))
              prefix = lines[:start]
              if any(line.startswith('msgid_plural ') for line in prefix):
                  prefix.append('msgstr[0] ' + q(ko))
              else:
                  prefix.append('msgstr ' + q(ko))
              out.append('\n'.join(prefix))

          final = '\n\n'.join(out) + '\n'
          Path('files/lang/ko.po').write_text(final, encoding='utf-8', newline='')

          assert final.count('\nmsgid ') == 3240
          assert final.count('\nmsgid_plural ') == 30
          assert 'msgid "Move the %{name} "' in final
          assert 'msgid "Map: "' in final
          assert 'msgid "Warrior"\nmsgstr "전사"' in final
          print('ko.po rebuilt: 3240 entries, 30 plurals')
          PY

          msgattrib --clear-fuzzy --no-obsolete files/lang/ko.po -o /tmp/ko.clean.po
          mv /tmp/ko.clean.po files/lang/ko.po
          msgfmt --check --check-format files/lang/ko.po -o /tmp/ko.mo
          test -s /tmp/ko.mo

      - name: Commit clean final catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/ko_parts .github/ko_parts2 .github/ko_payload2 .github/ko_payload3
          rm -f .github/workflows/finalize_ko_po.yml
          git add -A
          git diff --cached --check
          git commit -m "Finalize full Korean translation catalog"
          git push origin HEAD:korean-utf8-prototype
