name: Finalize Korean PO

on:
  push:
    branches:
      - korean-utf8-prototype
    paths:
      - .github/workflows/finalize_ko_po.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Rebuild and validate full ko.po
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recover and validate full Korean catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, bz2, gzip, re

          candidates = [
              Path('.github/ko_parts'),
              Path('.github/ko_parts2'),
              Path('.github/ko_payload2'),
              Path('.github/ko_payload3'),
          ]

          def validate(text: str) -> bool:
              lines = text.splitlines()
              entries = sum(1 for line in lines if line.startswith('msgid ')) - 1
              plurals = sum(1 for line in lines if line.startswith('msgid_plural '))
              fuzzy = sum(1 for line in lines if line.startswith('#,') and 'fuzzy' in line)
              return (
                  entries == 3240
                  and plurals == 30
                  and fuzzy == 0
                  and 'msgid "Move the %{name} "' in text
                  and 'msgid "Map: "' in text
                  and 'msgid "Warrior"' in text
                  and 'msgstr "전사"' in text
              )

          recovered = None
          source = None

          for directory in candidates:
              if not directory.exists():
                  continue
              parts = sorted(directory.glob('part*.b64'))
              if not parts:
                  continue

              raw = ''.join(p.read_text(encoding='ascii', errors='ignore') for p in parts)
              raw = re.sub(r'\s+', '', raw)
              raw += '=' * (-len(raw) % 4)

              try:
                  payload = base64.b64decode(raw, validate=False)
              except Exception as exc:
                  print(f'{directory}: base64 decode failed: {exc}')
                  continue

              for codec, decoder in [('gzip', gzip.decompress), ('bzip2', bz2.decompress)]:
                  try:
                      data = decoder(payload)
                      text = data.decode('utf-8')
                  except Exception as exc:
                      print(f'{directory}: {codec} failed: {exc}')
                      continue

                  if validate(text):
                      recovered = text
                      source = f'{directory} ({codec})'
                      break
                  print(f'{directory}: {codec} decoded but catalog validation failed')
              if recovered is not None:
                  break

          if recovered is None:
              raise SystemExit('No temporary payload reconstructed a valid 3240-entry Korean catalog')

          # Normalize only the header newline escaping if necessary.
          blocks = recovered.split('\n\n', 1)
          if len(blocks) == 2:
              header, body = blocks
              header = header.replace('\\\\n"', '\\n"')
              recovered = header + '\n\n' + body

          if '"Language: ko\\n"' not in recovered:
              raise SystemExit('Korean language header missing')
          if '"Plural-Forms: nplurals=1; plural=0;\\n"' not in recovered:
              raise SystemExit('Korean plural header missing')

          Path('files/lang/ko.po').write_text(recovered, encoding='utf-8', newline='')
          print(f'Recovered from {source}')
          print('entries=3240')
          print('plural_entries=30')
          print('fuzzy_entries=0')
          PY

      - name: Validate gettext catalog
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          msgfmt --check --check-format files/lang/ko.po -o /tmp/ko.mo
          test -s /tmp/ko.mo
          msgunfmt /tmp/ko.mo > /tmp/ko.roundtrip.po
          test -s /tmp/ko.roundtrip.po

      - name: Commit final catalog and remove temporary transport files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf .github/ko_parts .github/ko_parts2 .github/ko_payload2 .github/ko_payload3
          rm -f .github/workflows/finalize_ko_po.yml

          git add -A
          git diff --cached --check
          git commit -m "Finalize full Korean translation catalog"
          git push origin HEAD:korean-utf8-prototype
