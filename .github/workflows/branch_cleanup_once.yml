name: One-time branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/branch_cleanup_once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: startsWith(github.event.head_commit.message, '[branch-cleanup]')
    runs-on: ubuntu-latest

    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branches=(
            "android-package-release-polish"
            "feature/legacy-cheat-codes"
            "feature/legacy-cheat-codes-work"
            "fix/korean-video-subtitle-contrast"
            "korean-android-build"
            "korean-intro-subtitles"
            "korean-ui-test"
            "korean-utf8-prototype"
            "release/campaign-subtitles-20260903"
            "utf8-large-alphabet-core"
            "utf8-large-alphabet-korean-demo"
            "utf8-large-alphabet-prototype"
            "maintenance/branch-cleanup-temp"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || {
              echo "Failed to delete $branch"
              exit 1
            }
          done
