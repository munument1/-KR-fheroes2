name: Finalize Korean PO v2

on:
  push:
    branches:
      - korean-utf8-prototype
    paths:
      - .github/workflows/finalize_ko_po_v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: Rebuild and validate Korean catalog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebuild Korean target payload
        shell: bash
        run: |
          cat .github/ko_payload3/part*.b64 | base64 --decode > /tmp/ko_strings.json.bz2
          bzip2 --decompress --stdout /tmp/ko_strings.json.bz2 > /tmp/ko_strings.json
          echo "9b35eb80b3763266565072b7624310976431575d564566098632cba4419d7e1b  /tmp/ko_strings.json" | sha256sum -c -

      - name: Generate full ko.po and run structural QA
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import json
          import re
          from collections import Counter
          from pathlib import Path

          source_path = Path('files/lang/tr.po')
          target_path = Path('files/lang/ko.po')
          korean = json.loads(Path('/tmp/ko_strings.json').read_text(encoding='utf-8'))

          assert isinstance(korean, list)
          assert len(korean) == 3240, len(korean)
          assert all(isinstance(value, str) and value != '' for value in korean)

          def qvalue(text):
              return ast.literal_eval(text.strip())

          def blank_entry():
              return {
                  'msgctxt': '',
                  'msgid': '',
                  'msgid_plural': '',
                  'msgstr': '',
                  'msgstr_plural': {},
                  'flags': [],
                  'refs': [],
                  'extracted_comments': [],
              }

          def parse_po(path):
              entries = []
              state = {'entry': blank_entry(), 'active': None}

              def flush():
                  entry = state['entry']
                  if entry['msgid'] or entry['msgid_plural']:
                      entries.append(entry)
                  state['entry'] = blank_entry()
                  state['active'] = None

              def append_active(value):
                  kind, index = state['active']
                  entry = state['entry']
                  if kind == 'msgstr_plural':
                      entry['msgstr_plural'][index] = entry['msgstr_plural'].get(index, '') + value
                  else:
                      entry[kind] += value

              for raw in path.read_text(encoding='utf-8-sig').splitlines():
                  line = raw.rstrip('\n')
                  entry = state['entry']

                  if not line.strip():
                      flush()
                      continue
                  if line.startswith('#:'):
                      entry['refs'].extend(line[2:].strip().split())
                      state['active'] = None
                      continue
                  if line.startswith('#,'):
                      entry['flags'].extend(x.strip() for x in line[2:].split(',') if x.strip())
                      state['active'] = None
                      continue
                  if line.startswith('#.'):
                      entry['extracted_comments'].append(line[2:].strip())
                      state['active'] = None
                      continue
                  if line.startswith('#'):
                      state['active'] = None
                      continue
                  if line.startswith('msgctxt '):
                      entry['msgctxt'] = qvalue(line[len('msgctxt '):])
                      state['active'] = ('msgctxt', None)
                      continue
                  if line.startswith('msgid_plural '):
                      entry['msgid_plural'] = qvalue(line[len('msgid_plural '):])
                      state['active'] = ('msgid_plural', None)
                      continue
                  if line.startswith('msgid '):
                      entry['msgid'] = qvalue(line[len('msgid '):])
                      state['active'] = ('msgid', None)
                      continue
                  if line.startswith('msgstr['):
                      close = line.index(']')
                      index = int(line[len('msgstr['):close])
                      entry['msgstr_plural'][index] = qvalue(line[close + 1:].strip())
                      state['active'] = ('msgstr_plural', index)
                      continue
                  if line.startswith('msgstr '):
                      entry['msgstr'] = qvalue(line[len('msgstr '):])
                      state['active'] = ('msgstr', None)
                      continue
                  if line.startswith('"') and state['active'] is not None:
                      append_active(qvalue(line))
                      continue
                  raise RuntimeError(f'Unsupported PO line: {line!r}')

              flush()
              return entries

          entries = parse_po(source_path)
          assert len(entries) == 3240, len(entries)
          assert sum(bool(e['msgid_plural']) for e in entries) == 30

          token_re = re.compile(r'%\{[^}]+\}|%(?:\d+\$)?[diuoxXfFeEgGaAcspn%]')

          def tokens(text):
              return Counter(token_re.findall(text))

          for index, (entry, target) in enumerate(zip(entries, korean), 1):
              singular_tokens = tokens(entry['msgid'])
              target_tokens = tokens(target)
              if entry['msgid_plural']:
                  plural_tokens = tokens(entry['msgid_plural'])
                  assert singular_tokens == plural_tokens, (index, entry['msgid'], entry['msgid_plural'])
                  assert singular_tokens == target_tokens, (index, entry['msgid'], target)
              else:
                  assert singular_tokens == target_tokens, (index, entry['msgid'], target)

          def po_quote(value):
              escaped = (value.replace('\\', '\\\\')
                              .replace('"', '\\"')
                              .replace('\t', '\\t')
                              .replace('\r', '\\r')
                              .replace('\n', '\\n'))
              return '"' + escaped + '"'

          out = [
              '# Korean translation for fheroes2',
              '# Copyright (C) 2026 fheroes2 team <fhomm2@gmail.com>',
              '# This file is distributed under the same license as the fheroes2 package.',
              '#',
              'msgid ""',
              'msgstr ""',
              '"Project-Id-Version: fheroes2\\n"',
              '"Report-Msgid-Bugs-To: \\n"',
              '"POT-Creation-Date: 2026-06-10 08:09+0000\\n"',
              '"PO-Revision-Date: 2026-08-14 15:38+0900\\n"',
              '"Language-Team: Korean\\n"',
              '"Language: ko\\n"',
              '"MIME-Version: 1.0\\n"',
              '"Content-Type: text/plain; charset=UTF-8\\n"',
              '"Content-Transfer-Encoding: 8bit\\n"',
              '"Plural-Forms: nplurals=1; plural=0;\\n"',
              '',
          ]

          for entry, target in zip(entries, korean):
              for comment in entry['extracted_comments']:
                  out.append('#. ' + comment)
              if entry['refs']:
                  out.append('#: ' + ' '.join(entry['refs']))
              flags = [flag for flag in entry['flags'] if flag != 'fuzzy']
              if flags:
                  out.append('#, ' + ', '.join(flags))
              if entry['msgctxt']:
                  out.append('msgctxt ' + po_quote(entry['msgctxt']))
              out.append('msgid ' + po_quote(entry['msgid']))
              if entry['msgid_plural']:
                  out.append('msgid_plural ' + po_quote(entry['msgid_plural']))
                  out.append('msgstr[0] ' + po_quote(target))
              else:
                  out.append('msgstr ' + po_quote(target))
              out.append('')

          target_path.write_text('\n'.join(out), encoding='utf-8', newline='\n')

          generated = parse_po(target_path)
          assert len(generated) == 3240
          assert sum(bool(e['msgid_plural']) for e in generated) == 30
          assert [e['msgid'] for e in generated] == [e['msgid'] for e in entries]
          assert [e['msgid_plural'] for e in generated] == [e['msgid_plural'] for e in entries]
          assert all('fuzzy' not in e['flags'] for e in generated)

          text = target_path.read_text(encoding='utf-8')
          assert '"Language: ko\\n"' in text
          assert '"Plural-Forms: nplurals=1; plural=0;\\n"' in text
          print('entries=3240')
          print('plural_entries=30')
          print('placeholder_mismatches=0')
          PY

      - name: Validate gettext catalog
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          msgfmt --check --check-format files/lang/ko.po -o /tmp/ko.mo
          test -s /tmp/ko.mo
          msgunfmt /tmp/ko.mo > /tmp/ko.roundtrip.po
          test -s /tmp/ko.roundtrip.po
          echo "ko.mo bytes=$(stat -c%s /tmp/ko.mo)"

      - name: Commit full Korean catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/lang/ko.po
          git diff --cached --check
          git commit -m "Finalize full Korean translation catalog"
          git push origin HEAD:korean-utf8-prototype
