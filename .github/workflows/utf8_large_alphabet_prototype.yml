name: UTF-8 Large Alphabet Prototype

on:
  push:
    branches:
      - utf8-large-alphabet-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-sdl2:
    name: Linux SDL2 prototype build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev gettext ninja-build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate complete Hangul large alphabet
        run: |
          python -m pip install --disable-pip-version-check pillow polib
          mkdir -p build
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.ttf',
              'build/Galmuri11.ttf'
          )
          PY
          python script/generate_large_alphabet_font.py \
            build/Galmuri11.ttf \
            src/fheroes2/gui/ui_large_alphabet_generated.h \
            --po files/lang/ko.po \
            --range AC00:D7A3
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('src/fheroes2/gui/ui_large_alphabet_generated.h').read_text(encoding='utf-8')
          match = re.search(r'glyphCount = (\d+)', text)
          if match is None or int(match.group(1)) < 11172:
              raise SystemExit('Generated large alphabet is missing the complete modern Hangul syllable block.')
          if '0xAC00U' not in text or '0xD7A3U' not in text:
              raise SystemExit('Generated large alphabet does not span U+AC00 through U+D7A3.')
          print(f'Generated {match.group(1)} large-alphabet glyphs.')
          PY

      - name: Build UTF-8 Korean catalog
        run: |
          python - <<'PY'
          import polib

          po = polib.pofile('files/lang/ko.po', encoding='utf-8')
          po.metadata['Content-Type'] = 'text/plain; charset=UTF-8'
          po.metadata['Plural-Forms'] = 'nplurals=1; plural=0;'

          # Keep this build-time correction isolated from the renderer work.
          # The source PO can be cleaned independently after the UTF-8 path is proven.
          sphinx = po.find("sphinx|'\n\nYour answer?")
          if sphinx is not None and sphinx.msgstr == '\n\n당신의 답은?':
              sphinx.msgstr = "'\n\n당신의 답은?"

          korean_name = po.find('Korean')
          if korean_name is None:
              po.append(polib.POEntry(msgid='Korean', msgstr='한국어'))
          else:
              korean_name.msgstr = '한국어'

          for entry in po:
              if 'fuzzy' in entry.flags and (entry.msgstr or entry.msgstr_plural):
                  entry.flags.remove('fuzzy')

          po.save_as_mofile('files/lang/ko.mo')
          print(f'Built UTF-8 Korean catalog with {len(po)} entries.')
          PY
          msgunfmt files/lang/ko.mo | grep -q 'charset=UTF-8'

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -DENABLE_IMAGE=ON \
            -DENABLE_TOOLS=ON

      - name: Build
        run: cmake --build build

  windows-x64:
    name: Windows x64 UTF-8 prototype build
    needs: linux-sdl2
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install fheroes2 dependencies
        run: script/windows/install_packages.bat

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate complete Hangul large alphabet
        run: |
          python -m pip install --disable-pip-version-check pillow polib
          mkdir -p build
          python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              'https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.ttf',
              'build/Galmuri11.ttf'
          )
          PY
          python script/generate_large_alphabet_font.py \
            build/Galmuri11.ttf \
            src/fheroes2/gui/ui_large_alphabet_generated.h \
            --po files/lang/ko.po \
            --range AC00:D7A3

      - name: Build UTF-8 Korean catalog
        run: |
          mkdir -p build/x64/Release-SDL2/files/lang
          python - <<'PY'
          import polib

          po = polib.pofile('files/lang/ko.po', encoding='utf-8')
          po.metadata['Content-Type'] = 'text/plain; charset=UTF-8'
          po.metadata['Plural-Forms'] = 'nplurals=1; plural=0;'

          sphinx = po.find("sphinx|'\n\nYour answer?")
          if sphinx is not None and sphinx.msgstr == '\n\n당신의 답은?':
              sphinx.msgstr = "'\n\n당신의 답은?"

          korean_name = po.find('Korean')
          if korean_name is None:
              po.append(polib.POEntry(msgid='Korean', msgstr='한국어'))
          else:
              korean_name.msgstr = '한국어'

          for entry in po:
              if 'fuzzy' in entry.flags and (entry.msgstr or entry.msgstr_plural):
                  entry.flags.remove('fuzzy')

          po.save_as_mofile('build/x64/Release-SDL2/files/lang/ko.mo')
          print(f'Built UTF-8 Korean catalog with {len(po)} entries.')
          PY

      - uses: microsoft/setup-msbuild@v3

      - name: Build fheroes2
        run: MSBuild.exe fheroes2-vs2019.vcxproj /property:Platform=x64 /property:Configuration=Release-SDL2

      - name: Upload Windows prototype
        uses: actions/upload-artifact@v7
        with:
          name: fheroes2-utf8-large-alphabet-windows-x64
          path: |
            build/x64/Release-SDL2/fheroes2.exe
            build/x64/Release-SDL2/*.dll
            build/x64/Release-SDL2/files/lang/ko.mo
          if-no-files-found: error
