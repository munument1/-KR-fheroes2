name: Fix Legacy Cheat Behavior

on:
  push:
    branches:
      - feature/legacy-cheat-codes
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/legacy-cheat-codes

      - name: Patch Black Dragon and battle luck cheats
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/fheroes2/gui/interface_events.cpp')
          text = path.read_text(encoding='utf-8')
          old = '    static const std::array<std::string_view, 16> cheatCodes\n        = { "911", "1313", "1911", "8675309", "123456789", "101495", "101111", "899101", "844691", "844690", "32167", "1134", "1135", "1136", "1137", "1138" };'
          new = '    static const std::array<std::string_view, 15> cheatCodes\n        = { "911", "1313", "1911", "8675309", "101495", "101111", "899101", "844691", "844690", "32167", "1134", "1135", "1136", "1137", "1138" };'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Adventure cheat code list not found.')

          old = '    if ( activatedCode == "123456789" ) {\n        hero->SetModes( Heroes::CHEAT_MAX_LUCK );\n        RedrawFocus();\n        return fheroes2::GameMode::CANCEL;\n    }\n\n'
          text = text.replace(old, '', 1)

          old = '    if ( activatedCode == "32167" ) {\n        if ( hero->inCastle() == nullptr ) {\n            hero->GetArmy().JoinTroop( Monster::BLACK_DRAGON, 5, false );\n            RedrawFocus();\n        }\n        return fheroes2::GameMode::CANCEL;\n    }'
          new = '    if ( activatedCode == "32167" ) {\n        hero->GetArmy().JoinTroop( Monster::BLACK_DRAGON, 5, false );\n        RedrawFocus();\n        return fheroes2::GameMode::CANCEL;\n    }'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Black Dragon cheat block not found.')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('src/fheroes2/heroes/heroes.h')
          text = path.read_text(encoding='utf-8')
          old = '        // Gives this hero maximum luck. Used by the original 123456789 cheat code.\n        CHEAT_MAX_LUCK = 0x00000010,\n        // UNUSED = 0x00000020,'
          new = '        // UNUSED = 0x00000010,\n        // UNUSED = 0x00000020,'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Hero cheat mode block not found.')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('src/fheroes2/heroes/heroes.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'int Heroes::getLuckWithModifiers( std::string * text ) const\n{\n    if ( Modes( CHEAT_MAX_LUCK ) ) {\n        return Luck::IRISH;\n    }\n\n    int result = Luck::NORMAL;'
          new = 'int Heroes::getLuckWithModifiers( std::string * text ) const\n{\n    int result = Luck::NORMAL;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Hero luck modifier block not found.')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('src/fheroes2/battle/battle_interface.cpp')
          text = path.read_text(encoding='utf-8')
          marker = '    if ( le.isAnyKeyPressed() ) {\n        // Skip the turn'
          replacement = (
              '    if ( le.isAnyKeyPressed() ) {\n'
              '        static constexpr std::array<fheroes2::Key, 9> luckCheatCode{ fheroes2::Key::KEY_1, fheroes2::Key::KEY_2, fheroes2::Key::KEY_3,\n'
              '                                                                    fheroes2::Key::KEY_4, fheroes2::Key::KEY_5, fheroes2::Key::KEY_6,\n'
              '                                                                    fheroes2::Key::KEY_7, fheroes2::Key::KEY_8, fheroes2::Key::KEY_9 };\n'
              '        static size_t luckCheatProgress = 0;\n\n'
              '        const fheroes2::Key pressedKey = le.getPressedKeyValue();\n'
              '        if ( pressedKey == luckCheatCode[luckCheatProgress] ) {\n'
              '            ++luckCheatProgress;\n'
              '            if ( luckCheatProgress == luckCheatCode.size() ) {\n'
              '                assert( _currentUnit != nullptr );\n'
              '                _currentUnit->SetModes( LUCK_GOOD );\n'
              '                luckCheatProgress = 0;\n'
              '                _needRedraw = true;\n'
              '                return;\n'
              '            }\n'
              '        }\n'
              '        else {\n'
              '            luckCheatProgress = ( pressedKey == fheroes2::Key::KEY_1 ) ? 1 : 0;\n'
              '        }\n\n'
              '        // Skip the turn'
          )
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif 'static constexpr std::array<fheroes2::Key, 9> luckCheatCode' not in text:
              raise SystemExit('Battle input insertion point not found.')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fheroes2/gui/interface_events.cpp src/fheroes2/heroes/heroes.h src/fheroes2/heroes/heroes.cpp src/fheroes2/battle/battle_interface.cpp
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "fix: match legacy Black Dragon and battle luck cheats"
            git push origin HEAD:feature/legacy-cheat-codes
          fi

      - name: Dispatch Korean x64 test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run korean_utf8_prototype.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref feature/legacy-cheat-codes
