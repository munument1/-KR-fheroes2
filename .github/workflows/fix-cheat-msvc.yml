name: Fix cheat MSVC build

on:
  push:
    branches:
      - feature/legacy-cheat-codes

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/legacy-cheat-codes
      - name: Fix portable cheat parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/fheroes2/gui/interface_events.cpp')
          data = p.read_bytes()
          data = data.replace(b"'\x00'", b"'\\0'")
          s = data.decode('utf-8')
          s = s.replace('const auto isKnownPrefix = [&codeBuffer]() {', 'const auto isKnownPrefix = []() {')
          s = s.replace('return std::any_of( cheatCodes.begin(), cheatCodes.end(), [&codeBuffer]( const std::string_view code ) {',
                        'return std::any_of( cheatCodes.begin(), cheatCodes.end(), []( const std::string_view code ) {')
          s = s.replace('return code.size() >= codeBuffer.size() && code.compare( 0, codeBuffer.size(), codeBuffer ) == 0;',
                        'return code.size() >= codeBuffer.size() && code.compare( 0, codeBuffer.size(), codeBuffer.data(), codeBuffer.size() ) == 0;')
          p.write_text(s)
          PY
          clang-format-17 -i src/fheroes2/gui/interface_events.cpp
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fheroes2/gui/interface_events.cpp
          git commit -m "fix: make cheat parser portable on MSVC"
          git push origin HEAD:feature/legacy-cheat-codes
